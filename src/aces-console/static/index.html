<a class="skip" href="#plate-area">Skip to the plate</a>

<header class="strip" id="strip">
  <div class="wordmark" title="aces console">ACES</div>
  <h1 class="plate-name" id="plateName">Fabric</h1>
  <output class="stamp unknown" id="stamp" aria-live="polite" title="rig mode as GRID CONTROL reports it · fabric manifest age · event stream state">connecting…</output>
  <output class="fresh" id="freshness" aria-live="polite"></output>
  <span class="spacer"></span>
  <time class="clock mono" id="clock" aria-label="local time"></time>
</header>

<div class="atlas" id="atlas">
  <nav class="index rail" id="rail" aria-label="Plates">
    <ul class="plates" id="plateList" role="tablist" aria-orientation="vertical">
      <li><button role="tab" id="tab-fabric" data-plate="fabric" aria-selected="true" aria-controls="plate-fabric" tabindex="0" title="Fabric" aria-label="Fabric"><svg class="ic"><use href="#i-fleet"/></svg><span class="nm">Fabric</span></button></li>
      <li><button role="tab" id="tab-projects" data-plate="projects" aria-selected="false" aria-controls="plate-projects" tabindex="-1" title="Projects" aria-label="Projects"><svg class="ic"><use href="#i-projects"/></svg><span class="nm">Projects</span></button></li>
      <li><button role="tab" id="tab-pipeline" data-plate="pipeline" aria-selected="false" aria-controls="plate-pipeline" tabindex="-1" title="Pipeline" aria-label="Pipeline"><svg class="ic"><use href="#i-pipeline"/></svg><span class="nm">Pipeline</span></button></li>
      <li><button role="tab" id="tab-solvers" data-plate="solvers" aria-selected="false" aria-controls="plate-solvers" tabindex="-1" title="Solvers" aria-label="Solvers"><svg class="ic"><use href="#i-solvers"/></svg><span class="nm">Solvers</span></button></li>
      <li><button role="tab" id="tab-objects" data-plate="objects" aria-selected="false" aria-controls="plate-objects" tabindex="-1" title="Objects" aria-label="Objects"><svg class="ic"><use href="#i-objects"/></svg><span class="nm">Objects</span></button></li>
      <li><button role="tab" id="tab-evidence" data-plate="evidence" aria-selected="false" aria-controls="plate-evidence" tabindex="-1" title="Evidence" aria-label="Evidence"><svg class="ic"><use href="#i-evidence"/></svg><span class="nm">Evidence</span></button></li>
      <li><button role="tab" id="tab-agents" data-plate="agents" aria-selected="false" aria-controls="plate-agents" tabindex="-1" title="Agents" aria-label="Agents"><svg class="ic"><use href="#i-agents"/></svg><span class="nm">Agents</span></button></li>
      <li><button role="tab" id="tab-ops" data-plate="ops" aria-selected="false" aria-controls="plate-ops" tabindex="-1" title="Ops" aria-label="Ops"><svg class="ic"><use href="#i-ops"/></svg><span class="nm">Ops</span></button></li>
    </ul>
  </nav>

  <main class="plate-area" id="plate-area" tabindex="-1">
    <section class="plate" id="plate-fabric" data-plate="fabric" role="tabpanel" aria-labelledby="fabricTitle">
      <div class="plate-head"><h2 class="plate-title" id="fabricTitle">Fabric <span class="coord mono" id="coord-fabric"></span></h2></div>
      <div class="plate-body" id="body-fabric"></div>
    </section>
    <section class="plate" id="plate-projects" data-plate="projects" role="tabpanel" aria-labelledby="projectsTitle" hidden>
      <div class="plate-head"><h2 class="plate-title" id="projectsTitle">Projects <span class="coord mono" id="coord-projects"></span></h2></div>
      <div class="plate-body" id="body-projects"></div>
    </section>
    <section class="plate" id="plate-pipeline" data-plate="pipeline" role="tabpanel" aria-labelledby="pipelineTitle" hidden>
      <div class="plate-head"><h2 class="plate-title" id="pipelineTitle">Pipeline <span class="coord mono" id="coord-pipeline"></span></h2></div>
      <div class="plate-body" id="body-pipeline"></div>
    </section>
    <section class="plate" id="plate-solvers" data-plate="solvers" role="tabpanel" aria-labelledby="solversTitle" hidden>
      <div class="plate-head"><h2 class="plate-title" id="solversTitle">Solvers <span class="coord mono" id="coord-solvers"></span></h2></div>
      <div class="plate-body" id="body-solvers"></div>
    </section>
    <section class="plate" id="plate-objects" data-plate="objects" role="tabpanel" aria-labelledby="objectsTitle" hidden>
      <div class="plate-head"><h2 class="plate-title" id="objectsTitle">Objects <span class="coord mono" id="coord-objects"></span></h2></div>
      <div class="plate-body" id="body-objects"></div>
    </section>
    <section class="plate" id="plate-evidence" data-plate="evidence" role="tabpanel" aria-labelledby="evidenceTitle" hidden>
      <div class="plate-head"><h2 class="plate-title" id="evidenceTitle">Evidence <span class="coord mono" id="coord-evidence"></span></h2></div>
      <div class="plate-body" id="body-evidence"></div>
    </section>
    <section class="plate" id="plate-agents" data-plate="agents" role="tabpanel" aria-labelledby="agentsTitle" hidden>
      <div class="plate-head"><h2 class="plate-title" id="agentsTitle">Agents <span class="coord mono" id="coord-agents"></span></h2></div>
      <div class="plate-body" id="body-agents"></div>
    </section>
    <section class="plate" id="plate-ops" data-plate="ops" role="tabpanel" aria-labelledby="opsTitle" hidden>
      <div class="plate-head"><h2 class="plate-title" id="opsTitle">Ops <span class="coord mono" id="coord-ops"></span></h2></div>
      <div class="plate-body" id="body-ops"></div>
    </section>
  </main>

  <aside class="column" id="column" aria-label="Inspector">
    <div class="eye" id="eye"><div class="eye-name">nothing selected</div><div class="eye-coord mono">select a GPU, a project, a mode or a record</div></div>
    <div class="column-body" id="columnBody"></div>
  </aside>
</div>

<footer class="strip foot" id="foot">
  <div class="mono foot-facts" id="footFacts">aces-console —</div>
  <span class="spacer"></span>
  <span class="mono dim">aces console</span>
</footer>

<script type="module" src="/static/app.js"></script>
</body>
</html>
